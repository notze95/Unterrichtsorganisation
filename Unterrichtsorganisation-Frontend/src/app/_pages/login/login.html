<div class="login-container">

    <div class="login-card">

        <h2>Anmeldung</h2>

        <input type="text" placeholder="Benutzername" [(ngModel)]="username">

        <input type="password" placeholder="Passwort" [(ngModel)]="password">

        <button (click)="login()">
            Anmelden
        </button>

    </div>

</div>
